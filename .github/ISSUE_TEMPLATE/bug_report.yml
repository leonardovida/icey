name: Bug report
description: Something in Icey doesn't work as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Check the [latest release](https://github.com/leonardovida/icey/releases/latest), [BREAKING_CHANGES.md](https://github.com/leonardovida/icey/blob/main/BREAKING_CHANGES.md) and [FREQUENT_ISSUES.md](https://github.com/leonardovida/icey/blob/main/FREQUENT_ISSUES.md) first: your problem may already be fixed or explained.

        AI agents filing on a user's behalf are welcome. See [AGENTS.md](https://github.com/leonardovida/icey/blob/main/AGENTS.md#opening-issues-for-a-user).
  - type: checkboxes
    attributes:
      label: Search for similar reports
      description: Search [Icey's issues](https://github.com/leonardovida/icey/issues?q=is%3Aissue), open and closed.
      options:
        - label: I searched existing issues and didn't find this bug
          required: true
  - type: textarea
    attributes:
      label: Description
      placeholder: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings > Menu Bar Layout
        2. Drag '...' into the Hidden section
        3. See error
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Icey version
      description: Shown in Settings > About.
      placeholder: e.g. 0.11.13-dev.2-icey.1
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS version
      description: Run `sw_vers -productVersion` in Terminal.
      placeholder: e.g. 26.5.1
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac and displays
      placeholder: e.g. MacBook Pro 14" (M3, notch) with one external display
  - type: input
    id: upstream
    attributes:
      label: Same bug in Ice?
      description: Link the jordanbaird/Ice issue if there is one.
      placeholder: e.g. jordanbaird/Ice#954
  - type: textarea
    attributes:
      label: Additional information
      description: |
        Screenshots, screen recordings, crash reports (Console > Crash Reports > Ice) or logs. To collect logs, run:
        `log show --last 10m --predicate 'process == "Ice"' > icey.log`
  - type: dropdown
    id: agent
    attributes:
      label: Filed with an AI agent?
      options:
        - "No"
        - "Yes"

name: Feature request
description: Suggest a feature or an improvement for Icey.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome, including requests that were never picked up in Ice. Pull requests that build them are welcome too: see [CONTRIBUTING.md](https://github.com/leonardovida/icey/blob/main/CONTRIBUTING.md).
  - type: checkboxes
    attributes:
      label: Search for similar requests
      description: Search [Icey's issues](https://github.com/leonardovida/icey/issues?q=is%3Aissue), open and closed.
      options:
        - label: I searched existing issues and didn't find this request
          required: true
  - type: textarea
    attributes:
      label: Problem
      placeholder: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      placeholder: How should Icey behave? Mockups welcome.
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Requested in Ice too?
      placeholder: e.g. jordanbaird/Ice#26
  - type: checkboxes
    attributes:
      label: Contributing
      options:
        - label: I (or my AI agent) would like to work on a pull request for this
  - type: dropdown
    id: agent
    attributes:
      label: Filed with an AI agent?
      options:
        - "No"
        - "Yes"
